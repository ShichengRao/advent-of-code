# SonarQube Cloud analysis, run from .github/workflows/build.yml.
sonar.projectKey=ShichengRao_advent-of-code
sonar.organization=shichengrao
sonar.projectName=Advent of Code
sonar.sourceEncoding=UTF-8
sonar.java.source=21

sonar.sources=.
sonar.inclusions=**/*.java
# Golfed solutions are deliberately unreadable, and the 2023 JUnit tests need JUnit on the classpath.
sonar.exclusions=**/*Golfed.java,**/tests/**,tools/migration/**
# Nothing reports test coverage, so don't hold new code to a coverage target.
sonar.coverage.exclusions=**/*
# Each year starts with its own copy of the shared helpers, so those copies aren't flagged as duplicates.
sonar.cpd.exclusions=**/src/meta/**,**/src/objects/**
# sonar.java.binaries is added by the workflow, one compiled folder per year.
