name: Build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    name: Compile every year
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile
        run: |
          status=0
          for y in 20[0-9][0-9]; do
            echo "::group::$y"
            find "$y" -name '*.java' -not -path '*/tests/*' > "sources-$y.txt"
            javac -nowarn -XDsuppressNotes -encoding UTF-8 -d "build/$y" "@sources-$y.txt" || status=1
            echo "::endgroup::"
          done
          javac -d build/tools tools/Run.java || status=1
          exit $status
